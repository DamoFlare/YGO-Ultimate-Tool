<form class="action-bar" hx-post="/grading/search" hx-target="#grading-search-results-{{ pending_id }}" hx-swap="outerHTML">
  <input type="hidden" name="pending_id" value="{{ pending_id }}">
  <input type="text" name="query" placeholder="Search by name, ID, or set code..." required>
  <button class="btn-primary" type="submit">🔎 Search</button>
</form>
<div id="grading-search-results-{{ pending_id }}"></div>
