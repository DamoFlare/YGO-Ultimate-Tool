<p class="result-box">
  ✅ Aggiunta <b>{{ card_name }}</b> x{{ qty }} alla collezione!<br>
  Prezzo NM: €{{ '%.2f'|format(item.base_price) }}
  {% if item.price_source == "cardtrader" %}
    <span class="badge badge-source-cardtrader">reale CardTrader</span>
  {% else %}
    <span class="badge badge-source-none">nessun prezzo trovato</span>
  {% endif %}
</p>
