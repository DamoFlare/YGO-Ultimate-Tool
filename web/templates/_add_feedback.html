<p class="result-box">
  ✅ Added <b>{{ card_name }}</b> x{{ qty }} to the collection!<br>
  NM price: €{{ '%.2f'|format(item.base_price) }}
  {% if item.price_source == "cardtrader" %}
    <span class="badge badge-source-cardtrader">real CardTrader price</span>
  {% else %}
    <span class="badge badge-source-none">no price found</span>
  {% endif %}
</p>
