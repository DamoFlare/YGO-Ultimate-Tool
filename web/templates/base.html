<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Yu-Gi-Oh! TCG Valuer &amp; Collection Tracker{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js"></script>
</head>
<body>
    <header class="topbar">
        <h1>🎴 Yu-Gi-Oh! TCG Valuer &amp; Collection Tracker</h1>
        <p class="subtitle">YGOPRODeck Card Search &amp; CardTrader Price Engine</p>
    </header>
    <nav class="tabs">
        <a href="/" class="tab {{ 'active' if active_tab == 'collection' else '' }}">📋 Collezione &amp; Valutazione</a>
        <a href="/add" class="tab {{ 'active' if active_tab == 'add' else '' }}">➕ Aggiungi Carta</a>
        <a href="/bulk" class="tab {{ 'active' if active_tab == 'bulk' else '' }}">🚀 Aggiunta Bulk</a>
        <a href="/grading" class="tab {{ 'active' if active_tab == 'grading' else '' }}">🩺 Grading Carta (CV + AI)</a>
    </nav>
    <main class="page">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
